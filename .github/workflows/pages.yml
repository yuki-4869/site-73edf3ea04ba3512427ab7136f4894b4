name: Sync code and deploy library

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Check out site source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out public C++ sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yuki-4869/Algorithm
          ref: main
          path: source
          persist-credentials: false
      - name: Check out ACL for C++ verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: atcoder/ac-library
          ref: 864245a00b00dd008d1abfdc239618fdb7d139da
          path: ac-library
          persist-credentials: false
      - name: Read public source revision
        id: source
        run: printf 'sha=%s\n' "$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Check for code changes
        id: check
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: node scripts/check-update.mjs
      - name: Install renderer
        if: steps.check.outputs.changed == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check AND-zero permutation
        if: steps.check.outputs.changed == 'true'
        run: |
          if [ -f source/MathCombinatorics/and_zero_permutation.cpp ]; then
            g++ -std=c++23 -O2 -Wall -Wextra -Wconversion -pedantic -Isource tests/and_zero_permutation_test.cpp -o "$RUNNER_TEMP/and-zero-permutation-test"
            "$RUNNER_TEMP/and-zero-permutation-test"
          fi
      - name: Check library usage and template compatibility
        if: steps.check.outputs.changed == 'true'
        run: python3 tests/check-library.py --source source --acl ac-library --output "$RUNNER_TEMP/library-usage-checks"
      - name: Run library regressions
        if: steps.check.outputs.changed == 'true'
        run: |
          for name in range_set coordinate_compression segment_wrappers disjoint_sparse_table persistent_segment_tree persistent_lazy_segment_tree; do
            g++ -std=c++23 -O2 -Iac-library -Isource "tests/${name}_test.cpp" -o "$RUNNER_TEMP/${name}_test"
            "$RUNNER_TEMP/${name}_test"
          done
          for name in coordinate_compression segment_wrappers disjoint_sparse_table persistent_segment_tree persistent_lazy_segment_tree; do
            g++ -std=c++23 -O2 -DNDEBUG -Iac-library -Isource "tests/${name}_test.cpp" -o "$RUNNER_TEMP/${name}_ndebug_test"
            "$RUNNER_TEMP/${name}_ndebug_test"
          done
      - name: Check VS Code snippets
        if: steps.check.outputs.changed == 'true'
        run: |
          python3 scripts/make-snippets.py --source source --output "$RUNNER_TEMP/algorithm.code-snippets"
          python3 tests/check-snippets.py --source source --snippets "$RUNNER_TEMP/algorithm.code-snippets"
      - name: Build reference pages
        if: steps.check.outputs.changed == 'true'
        env:
          SOURCE_DIR: source
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: npm run build
      - name: Verify pages and source hashes
        if: steps.check.outputs.changed == 'true'
        run: npm run check
      - name: Test synchronization scenarios
        if: steps.check.outputs.changed == 'true'
        env:
          SOURCE_DIR: source
        run: npm test
      - name: Configure Pages
        if: steps.check.outputs.changed == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    if: needs.build.outputs.changed == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reference
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

